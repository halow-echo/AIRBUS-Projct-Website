<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRBUS Engineering</title>
    <link rel="icon" href="../assets/images/airbus-icon-web.jpg">
    <link rel="stylesheet" href="css/output.css" />
  </head>

  <body class="bg-slate-100">
    <header class="bg-[#00205B] shadow-md w-full">

      <div
        class="
        max-w-7xl 
        mx-auto 
        px-6 
        py-4 
        flex 
        justify-between 
        items-center
        ">

        <div class="flex items-center space-x-3">
          <img src="../assets/images/logo.svg" alt="Logo" class="w-full h-5 object-contain z-0"/>
        </div>

          <nav class="flex space-x-8">
          <a
            href="index.html" class="
            relative 
            text-gray-50 
            font-medium 
            transition 
            py-1 
            after:absolute 
            after:bottom-0 
            after:left-0 
            after:w-0 
            after:h-[2px] 
            after:bg-gray-50 
            after:transition-all 
            after:duration-300 
            hover:after:w-full
            ">Home</a>

          <a
            href="page/about.html" class="
            relative 
            text-gray-50 
            font-medium 
            transition 
            py-1 
            after:absolute 
            after:bottom-0 
            after:left-0 
            after:w-0 
            after:h-[2px] 
            after:bg-gray-50 
            after:transition-all 
            after:duration-300 
            hover:after:w-full
            ">About</a>

          <a
            href="page/contact.html" class="
            relative 
            text-gray-50 
            font-medium 
            transition 
            py-1 
            after:absolute 
            after:bottom-0 
            after:left-0 
            after:w-0 
            after:h-[2px] 
            after:bg-gray-50 
            after:transition-all 
            after:duration-300 
            hover:after:w-full
            ">Contact</a>

          <div class="relative group py-1 ">
            <a
            class="
            relative 
            text-gray-50 
            font-medium 
            cursor-pointer
            transition 
            py-1 
            after:absolute 
            after:bottom-0 
            after:left-0 
            after:w-0 
            after:h-[2px] 
            after:bg-gray-50 
            after:transition-all 
            after:duration-300 
            hover:after:w-full
            ">More</a>

            <ul 
            class="
            z-10
            hidden 
            group-hover:block 
            absolute 
            top-full 
            left-0 
            bg-[#00205B] 
            list-none 
            min-w-[150px]
            shadow-[0_4px_10px_rgba(0,0,0,0.15)] 
            border-2 
            border-gray-100 rounded-[4px] 
            [&_a]:text-[#e8e6df] 
            [&_a]:py-[10px] 
            [&_a]:px-[15px] 
            [&_a]:block 
            [&_a]:font-normal 
            [&_a:hover]:bg-blue-400 
            [&_a:hover]:text-gray-50 
            [&_a:hover]:font-bold
            ">
              <li class="border-b border-gray-100"><a href="#">Projects</a></li>
              <li><a href="#">Design</a></li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <div class="overflow-hidden relative border-y-2 border-gray-100">
        <img 
        src="../assets/images/airbus-banner.jpg" 
        class="h-64 w-screen object-cover object-center from-black"
        alt="Airbus Planes Banner">
      </div>

      <div>
        <h1 class="font-bold text-4xl text-center p-8">Pioneering sustainable aerospace for a safe and united world!</h1>
      </div>

      
    </main>
  </body>
</html>
